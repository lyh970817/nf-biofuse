plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.15'
}

version = '0.1.0'

nextflowPlugin {
    // The minimum Nextflow version the plugin supports, and the version it compiles against. The
    // TraceObserverV2 and ConfigScope extension points it uses exist from 25.10 on.
    nextflowVersion = '25.10.0'

    provider = 'lyh970817'
    className = 'io.github.lyh970817.nfbiofuse.BiofusePlugin'
    extensionPoints = [
        'io.github.lyh970817.nfbiofuse.BiofuseConfig',
        'io.github.lyh970817.nfbiofuse.BiofuseObserverFactory'
    ]

}
