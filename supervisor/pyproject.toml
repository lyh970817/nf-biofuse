[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nf-core-gwas-biofuse"
version = "0.1.0"
description = "Host-side launcher that serves a VCF Zarr cohort to nf-core/gwas as a BioFuse PLINK 1 view"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# The versions here are the ones the view identity is measured on: biofuse and vcztools enter the
# identity preimage, so a change to either is a change to every declared genotype_view_id.
dependencies = [
    "biofuse==0.1.0",
    "vcztools==0.2.0",
    "zarr==3.4.0",
    "numcodecs==0.17.0",
    "pyfuse3==3.4.1",
]

[project.optional-dependencies]
# bio2zarr's vcf extra is cyvcf2, which vcf2zarr needs to read the VCF the local FUSE tier builds its store from.
test = ["pytest>=8", "jsonschema>=4", "bio2zarr[vcf]==0.2.1"]

[project.scripts]
nf-core-gwas-biofuse = "nf_core_gwas_biofuse.cli:main"

[tool.setuptools.packages.find]
include = ["nf_core_gwas_biofuse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
