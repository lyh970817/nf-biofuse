# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nf-biofuse-supervisor"
version = "0.1.0"
description = "Lifecycle owner of a BioFuse PLINK 1 view of a VCF Zarr store, started by the nf-biofuse Nextflow plugin"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# The versions here are the ones the view identity is measured on: biofuse and vcztools enter the
# identity preimage, so a change to either is a change to every declared view identity.
dependencies = [
    "biofuse==0.1.0",
    "vcztools==0.2.0",
    "zarr==3.4.0",
    "numcodecs==0.17.0",
    "pyfuse3==3.4.1",
]

[project.optional-dependencies]
# bio2zarr's vcf extra is cyvcf2, which vcf2zarr needs to read the VCF the local FUSE tier builds its store from.
test = ["pytest>=8", "bio2zarr[vcf]==0.2.1"]

[project.scripts]
nf-biofuse-supervisor = "nf_biofuse_supervisor.cli:main"

[tool.setuptools.packages.find]
include = ["nf_biofuse_supervisor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
