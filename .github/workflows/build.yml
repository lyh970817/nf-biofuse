name: nf-biofuse CI
on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - '*'
jobs:
  plugin:
    name: Plugin (Nextflow ${{ matrix.nextflow_version }})
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 25.10 is the minimum the plugin declares; 26.04 is the release it is developed against.
        nextflow_version: ['25.10', '26.04']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The Nextflow Gradle plugin compiles with a Java 21 toolchain.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Unit tests
        run: make test
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Setup Nextflow ${{ matrix.nextflow_version }}
        uses: nf-core/setup-nextflow@b9f764e8ba5c76b712ace14ecbfcef0e40ae2dd8 # v1
        with:
          version: "${{ matrix.nextflow_version }}"

      - name: Install
        run: make install

      # CI has no FUSE mount to serve, so this loads the plugin without enabling it: it proves the plugin
      # starts on this Nextflow and leaves a pipeline alone when the biofuse scope is absent.
      - name: Validation pipeline, plugin loaded and disabled
        run: nextflow run validation/ -plugins nf-biofuse@$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)

  supervisor:
    name: Supervisor pure tier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Supervisor environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: supervisor/environment.yml
          environment-name: nf-biofuse-supervisor

      - name: pytest
        run: |
          python -m pip install 'pytest>=8'
          cd supervisor && python -m pytest -q
